version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build: 
      context: ./frontend
    container_name: chatbot_frontend
    environment:
      # If NEXT_PUBLIC_API_URL is empty, it makes relative requests which nginx will proxy correctly
      - NODE_ENV=production
    expose:
      - "3000"
    restart: always

  backend:
    build: 
      context: ./backend
    container_name: chatbot_backend
    environment:
      # UPDATE THESE TO VM2'S INTERNAL IP ADDRESS AFTER PROVISIONING!
      - DATABASE_URL=postgresql://chatbot_user:chatbot_password@DATA_VM_IP:5432/chatbot_db
      - QDRANT_HOST=DATA_VM_IP
      - QDRANT_PORT=6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    expose:
      - "8000"
    restart: always
