version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: chatbot_frontend
    environment:
      # If NEXT_PUBLIC_API_URL is empty, it makes relative requests which nginx will proxy correctly
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    restart: always

  backend:
    build:
      context: ./backend
    container_name: chatbot_backend
    environment:
      # These point to the Internal IP of VM 2 (Data Tier)
      - DATABASE_URL=postgresql://chatbot_user:chatbot_password@10.184.0.2:5432/chatbot_db
      - QDRANT_HOST=10.184.0.2
      - QDRANT_PORT=6333
      # Hardcoded API key (no quotes or ${} syntax needed in docker-compose)
      - GEMINI_API_KEY=
      - OPENROUTER_API_KEY=
    expose:
      - "8000"
    restart: always
