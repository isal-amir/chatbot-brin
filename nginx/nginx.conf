events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    server {
        listen 80;
        server_name _;

        # Route /api/ to the FastAPI backend
        # Note: In our current app, backend routes are /auth, /chat, /sessions, /admin
        # To make it easier for Nginx to distinguish backend traffic without rewriting frontend code,
        # we will route all known backend prefixes to the backend container.
        
        location ~ ^/(auth|chat|sessions|admin) {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route everything else to the Next.js frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Next.js websocket support (if using dev mode, though this is prod)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
